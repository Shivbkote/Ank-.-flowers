<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Payment - Ank. Flowers</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root{
      --primary:#7b1fa2;
      --accent:#d63384;
      --bg:#faf5ff;
    }

    body{
      font-family:"Poppins",sans-serif;
      background:linear-gradient(135deg,#fff1fb,#efe7ff);
      min-height:100vh;
      margin:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    /* Payment Wrap */
    .payment-wrap{
      width:100%;
      max-width:450px;
      background:#ffffffee;
      padding:22px;
      border-radius:16px;
      box-shadow:0 15px 40px rgba(0,0,0,0.09);
      backdrop-filter:blur(8px);
      animation:fadeIn .4s ease;
    }

    @keyframes fadeIn{
      from{opacity:0; transform:translateY(20px);}
      to{opacity:1; transform:translateY(0);}
    }

    .title{
      font-weight:900;
      color:var(--primary);
      text-align:center;
      margin-bottom:8px;
    }

    /* Payment Buttons */
    .pay-options{
      display:flex;
      gap:10px;
      margin-top:10px;
      overflow-x:auto;
      padding-bottom:5px;
    }

    .pay-btn{
      flex:1;
      text-align:center;
      padding:10px 12px;
      font-size:14px;
      border-radius:10px;
      border:2px solid #e5d6ff;
      cursor:pointer;
      transition:0.18s;
      white-space:nowrap;
      user-select:none;
    }

    .pay-btn.active{
      background:linear-gradient(135deg,var(--primary),var(--accent));
      color:#fff;
      border-color:transparent;
      box-shadow:0 4px 12px rgba(123,31,162,0.4);
    }

    /* Card UI */
    .input-card{
      margin-top:16px;
      padding:14px;
      border-radius:14px;
      background:#faf7ff;
      border:1px solid #eaddff;
      box-shadow:0 6px 20px rgba(0,0,0,0.05);
      animation:fadeIn .3s ease;
    }

    input{
      border-radius:10px !important;
      padding:10px !important;
      font-size:14px !important;
    }

    /* Pay button */
    .pay-now{
      margin-top:16px;
      width:100%;
      padding:12px;
      background:linear-gradient(135deg,var(--primary),var(--accent));
      border:none;
      color:#fff;
      font-weight:700;
      border-radius:14px;
      box-shadow:0 10px 22px rgba(123,31,162,0.3);
      transition:0.18s;
    }
    .pay-now:active{
      transform:scale(.97);
    }

    /* Success */
    .success-box{
      display:none;
      text-align:center;
      animation:fadeIn .4s ease;
    }

    .loader{
      margin:22px auto;
      width:70px;
      height:70px;
      border:7px solid #f3eaf8;
      border-top:7px solid var(--primary);
      border-radius:50%;
      animation:spin 1s linear infinite;
    }

    @keyframes spin{ to{ transform:rotate(360deg);} }
  </style>
</head>
<body>

  <div class="payment-wrap">

    <h3 class="title">Complete Your Payment</h3>
    <p class="text-center text-muted" id="amountLine">Amount: $0</p>

    <!-- Payment Options -->
    <div class="pay-options">
      <div class="pay-btn active" data-pay="card"><i class="bi bi-credit-card me-1"></i> Card</div>
      <div class="pay-btn" data-pay="upi"><i class="bi bi-upc-scan me-1"></i> UPI</div>
      <div class="pay-btn" data-pay="net"><i class="bi bi-bank me-1"></i> Netbank</div>
      <div class="pay-btn" data-pay="cod"><i class="bi bi-truck me-1"></i> COD</div>
    </div>

    <!-- CARD FORM -->
    <div class="input-card" id="cardForm">
      <input class="form-control mb-2" placeholder="Card Number (xxxx xxxx xxxx xxxx)">
      <input class="form-control mb-2" placeholder="Name on Card">
      <div class="d-flex gap-2">
        <input class="form-control" placeholder="MM/YY">
        <input class="form-control" placeholder="CVV">
      </div>
    </div>

    <!-- UPI FORM -->
    <div class="input-card" id="upiForm" style="display:none;">
      <input class="form-control" placeholder="Enter UPI ID (abc@bank)">
      <p class="text-muted mt-2 mb-0" style="font-size:12px;">* Any text will simulate successful payment.</p>
    </div>

    <!-- NETBANK -->
    <div class="input-card" id="netForm" style="display:none;">
      <select class="form-control">
        <option>Select your bank</option>
        <option>HDFC Bank</option>
        <option>ICICI Bank</option>
        <option>Axis Bank</option>
        <option>SBI</option>
      </select>
    </div>

    <!-- COD -->
    <div class="input-card" id="codForm" style="display:none;">
      <p class="mb-0 text-muted">Pay cash on delivery. No extra charges.</p>
    </div>

    <!-- Pay button -->
    <button class="pay-now" id="payBtn">Pay Now</button>

    <!-- Success Section -->
    <div class="success-box" id="successBox">
      <div class="loader"></div>
      <h4 class="mt-2" style="color:var(--primary)">Processing Payment...</h4>
      <p class="text-muted">Please wait</p>
    </div>
  </div>

<script>
  // Load order amount in dollars
  const ord = JSON.parse(localStorage.getItem("ank_order") || "null");
  if(ord) document.getElementById("amountLine").textContent = "Amount: $" + ord.total;

  // Toggle buttons
  document.querySelectorAll(".pay-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".pay-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");

      // hide all forms
      document.querySelectorAll(".input-card").forEach(f=>f.style.display="none");

      const t = btn.dataset.pay;
      if(t==="card") cardForm.style.display="block";
      if(t==="upi") upiForm.style.display="block";
      if(t==="net") netForm.style.display="block";
      if(t==="cod") codForm.style.display="block";
    });
  });

  // Pay simulation
  document.getElementById("payBtn").addEventListener("click",()=>{
    document.getElementById("successBox").style.display="block";
    setTimeout(()=>{
      window.location.href="success.html";
    },3500);
  });
</script>

</body>
</html>
