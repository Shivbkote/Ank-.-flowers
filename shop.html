    let lastScrollY = window.scrollY;
    const menuCollapse = document.getElementById('navbarNav');

    window.onscroll = function () {
      const currentScrollY = window.scrollY;
      const isMenuOpen = menuCollapse.classList.contains('show');

      if (isMenuOpen && currentScrollY > lastScrollY + 10) {
        if (!bsCollapseInstance) {
          bsCollapseInstance = bootstrap.Collapse.getOrCreateInstance(menuCollapse);
        }
        bsCollapseInstance.hide();
      }
      lastScrollY = currentScrollY;

  <script>
    // Animated Counters
    const counters = document.querySelectorAll('.count');

    const animateCounter = (counter) => {
      const target = +counter.getAttribute('data-target');
      let count = 0;
      const duration = 2000;
      const step = target / (duration / 30);

      const updateCount = () => {
        count += step;
        if (count < target) {
          counter.innerText = Math.floor(count);
          requestAnimationFrame(updateCount);
        } else {
          let shortValue;
          if (target >= 1000) {
            shortValue = (target / 1000).toFixed(1).replace('.0', '') + 'k+';
          } else if (target < 10) {
            shortValue = target + 'yr+';
          } else {
            shortValue = target + '+';
          }
          counter.innerText = shortValue;
        }
      };
      updateCount();
    };

    counters.forEach(counter => animateCounter(counter));
  </script>

    const cartCount = document.getElementById('cartCount');
    const viewModal = new bootstrap.Modal(document.getElementById('viewModal'));

    let showingAll = false;
    let cart = JSON.parse(localStorage.getItem('flowerCart')) || [];

    function updateCartCount() {
      cartCount.textContent = cart.length;
    }

    updateCartCount();
    
    // ⭐ NEW FUNCTION: Determines the number of columns based on Bootstrap breakpoints
    function getInitialVisibleCount() {
        const width = window.innerWidth;
        let columns;

        // Based on your Bootstrap classes: col-6 (XS/SM), col-md-4 (MD), col-lg-2 (LG+)
        if (width < 576) { // Extra small screens (col-6)
            columns = 2;
        } else if (width < 768) { // Small screens (col-6)
            columns = 2;
        } else if (width < 992) { // Medium screens (col-md-4)
            columns = 3;
        } else { // Large (col-lg-2) and up
            columns = 6;
        }
        
        // We want two full rows
        return columns * 2;
    }

    function renderProducts() {
      row.innerHTML = '';

      // ⭐ MODIFICATION: Use dynamic count instead of fixed '12'
      const initialCount = getInitialVisibleCount();
      const visibleProducts = !showingAll ? products.slice(0, initialCount) : products;

      visibleProducts.forEach(product => {
        const priceNum = parseFloat(product.price.replace('$', ''));
        const col = document.createElement('div');
        // Ensure this class list matches your column logic in getInitialVisibleCount()
        col.className = 'col-6 col-md-4 col-lg-2'; 
        
        col.innerHTML = `
        <div class="card product-card">
          <div class="product-img">
            <img src="${product.img}" alt="${product.title}">
            <span class="discount-badge">${product.discount}</span>
            <button class="view-btn" data-img="${product.img}" data-title="${product.title}" data-price="${product.price}">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="product-details">
            <h5 class="product-title">${product.title}</h5>
            <div class="d-flex align-items-center">
              <span class="price">${product.price}</span>
              <span class="old-price">${product.old}</span>
            </div>
            <p class="mb-1">Earliest Delivery: <span class="delivery-text">Today</span></p>
            <div class="d-flex align-items-center justify-content-between">
              <div><span class="rating">★★★★★</span></div>
              <button class="cart-btn" data-img="${product.img}" data-title="${product.title}" data-price="${priceNum}">
                <i class="bi bi-cart"></i>
              </button>
            </div>
          </div>
        </div>`;
        row.appendChild(col);
      });

      // ⭐ MODIFICATION: Control button visibility and text
      if (products.length > initialCount) {
          toggleBtn.style.display = 'block';
          toggleBtn.textContent = showingAll ? "Show Less Flowers" : "Show More Flowers";
      } else {
          toggleBtn.style.display = 'none'; // Hide button if all fit in two rows
      }
    }


    toggleBtn.addEventListener('click', () => {
      showingAll = !showingAll;
      renderProducts();
    });
    
    // ⭐ NEW LISTENER: Rerender on resize to maintain two rows
    window.addEventListener('resize', () => {
        // Only re-render if we are NOT currently showing all items
        if (!showingAll) {
            renderProducts();
        }
    });


    // Initial render
    renderProducts();

    // Config modal logic (Unchanged, retained for completeness)
    document.addEventListener('click', (e) => {
      const cartBtn = e.target.closest('.cart-btn');
      if (cartBtn) {
        const { title, price, img } = cartBtn.dataset;
        openConfigModal(title, parseFloat(price), img);
      }

      const viewBtn = e.target.closest('.view-btn');
      if (viewBtn) {
        document.getElementById('viewImage').src = viewBtn.dataset.img;
        document.getElementById('viewTitle').textContent = viewBtn.dataset.title;
        document.getElementById('viewPrice').textContent = `Price: ${viewBtn.dataset.price}`;
        viewModal.show();
      }
    });

    function openConfigModal(title, price, img) {
      configContent.innerHTML = `
        <div class="col-md-6 text-center">
          <img src="${img}" alt="${title}" class="product-config-img">
        </div>
        <div class="col-md-6">
          <h5 class="fw-bold">${title}</h5>
          <p class="sales-highlight">🔥 10 sold in last 10 hours</p>
          <p>Price: <strong>$${price.toFixed(2)}</strong></p>
          <div class="mb-3">
            <label class="form-label">Select Color <span class="text-danger">*</span></label>
            <select class="form-select" id="colorSelect" required>
              <option value="">Choose...</option>
              <option>🌹 Red</option>
              <option>🌸 Pink</option>
              <option>🌼 Yellow</option>
              <option>🤍 White</option>
               <option> 🌺 Purple</option>
                <option>💜 Lavender </option>
                 <option>💙 Blue </option>
                  <option> 🧡 Orange</option>
                   <option> 🧡 Orange</option>
                    <option>💖 Magenta</option>
            </select>
          </div>
          <div class="d-flex align-items-center mb-3">
            <label class="me-2">Quantity:</label>
            <button class="btn btn-outline-secondary btn-sm" id="minusBtn">-</button>
            <input type="number" id="qtyInput" class="form-control mx-2 text-center" value="1" min="1" style="width:70px;">
            <button class="btn btn-outline-secondary btn-sm" id="plusBtn">+</button>
          </div>
          <p class="subtotal">Subtotal: $<span id="subtotal">${price.toFixed(2)}</span></p>
          <p class="availability">Availability: Many In Stock</p>
          <button class="btn btn-primary w-100" id="addToCartConfirm">Add to Cart</button>
        </div>
      `;
      modal.show();

      const qtyInput = document.getElementById('qtyInput');
      const subtotal = document.getElementById('subtotal');
      const plus = document.getElementById('plusBtn');
      const minus = document.getElementById('minusBtn');

      const updateSubtotal = () => subtotal.textContent = (price * qtyInput.value).toFixed(2);
      qtyInput.oninput = updateSubtotal; // Update subtotal when input changes directly
      plus.onclick = () => { qtyInput.value = parseInt(qtyInput.value) + 1; updateSubtotal(); };
      minus.onclick = () => { if (qtyInput.value > 1) qtyInput.value = parseInt(qtyInput.value) - 1; updateSubtotal(); };

      document.getElementById('addToCartConfirm').onclick = () => {
        const color = document.getElementById('colorSelect').value;
        if (!color) {
          document.getElementById('colorSelect').classList.add('is-invalid');
          return;
        }

        // Add to cart storage
        const item = { title, price, img, qty: parseInt(qtyInput.value), color };
        cart.push(item);
        localStorage.setItem('flowerCart', JSON.stringify(cart));
        updateCartCount();

        configContent.innerHTML = `
          <div class="success-message">
            <i class="bi bi-check-circle-fill text-success fs-1 animate-pop"></i>
            <h5 class="mt-3 fw-semibold text-dark" style="font-size: 1rem;">Added Successfully to Cart!</h5>
            <p class="text-muted small mb-4">Your beautiful flowers are waiting in the cart 💐</p>
            <div class="d-flex gap-3 justify-content-center">
              <button class="btn small-btn rounded-pill px-3 py-2" data-bs-dismiss="modal">
                Continue Shopping
              </button>
              <button class="btn small-btn rounded-pill px-3 py-2" onclick="window.location.href='cart.html'">
                Move to Cart
              </button>
            </div>
          </div>`;
      };
    }

    floatingCart.addEventListener('click', () => {
      window.location.href = 'cart.html';
    });
</script>

        col.innerHTML = `

              <button class="view-btn" data-img="${product.img}" data-title="${product.title}" data-price="${product.price}">
                <i class="bi bi-eye"></i>

              </div>

              <div class="d-flex align-items-center justify-content-between">
                <div><span class="rating">★★★★★</span></div>
                <button class="cart-btn" data-img="${product.img}" data-title="${product.title}" data-price="${priceNum}">
                  <i class="bi bi-cart"></i>
                </button>
              </div>
            </div>
          </div>`;

        row.appendChild(col);
      });
    }


    // Live Search Function
    function liveSearch() {
      const query = searchInput.value.toLowerCase().trim();

      if (query === "") {
        renderProducts(); // reset full list
        return;
      }

      const filtered = products.filter(product =>
        product.title.toLowerCase().includes(query)
      );

      renderFilteredProducts(filtered);
    }


    // 🔍 Live Search Trigger — Works While Typing
    searchInput.addEventListener('input', liveSearch);

    // 🔍 Also run search when clicking button
    searchBtn.addEventListener('click', liveSearch);

  </script>
