<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Your Cart - Ank. Flowers</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root{
      --primary:#7b1fa2;
      --accent:#d63384;
    }
    body{ font-family:"Poppins",sans-serif; background:linear-gradient(120deg,#fff5fa,#f9f1ff); margin:0; padding:30px 16px;}
    .cart-container{ max-width:980px; margin:30px auto; background:#fff; border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,0.08); padding:18px; }
    .cart-title{ color:var(--primary); font-weight:800; text-align:center; margin-bottom:18px; }
    .cart-item{ display:flex; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid #f0edf7; }
    .cart-item img{ width:80px; height:80px; object-fit:cover; border-radius:10px; }
    .cart-item-info{ flex:1; }
    .cart-item-title{ font-weight:700; font-size:14px; }
    .cart-item-details{ color:#666; font-size:13px; margin-top:6px; }
    .cart-item-price{ color:var(--accent); font-weight:800; margin-top:8px; display:block; }
    .cart-item-right{ min-width:110px; text-align:right; }
    .qty-row{ display:flex; gap:8px; align-items:center; justify-content:flex-start; margin-top:8px; }
    .qty-btn{ width:28px; height:28px; border-radius:6px; background:#f6effb; border:1px solid rgba(123,31,162,0.08); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; font-weight:700; color:var(--primary); }
    .qty-input{ width:56px; height:32px; border-radius:8px; text-align:center; padding:4px; border:1px solid #eee; }
    .remove-btn{ color:var(--accent); font-size:18px; cursor:pointer; margin-top:6px; display:inline-block; }
    .cart-total{ text-align:right; margin-top:14px; font-weight:700; }
    .small-btn{ padding:8px 12px; font-size:14px; border-radius:10px; }
    .checkout-btn{ background:linear-gradient(90deg,var(--primary),var(--accent)); color:#fff; border:none; }
    .back-btn{ border:1px solid var(--primary); color:var(--primary); background:transparent; }
    .empty-cart{ text-align:center; padding:40px 10px; color:#777; }
    .empty-cart i{ font-size:48px; color:#e9d8f5; }

    /* checkout overlay */
    .overlay{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.5); z-index:9999; padding:20px; }
    .checkout-box{ width:100%; max-width:920px; background:#fff; border-radius:12px; padding:18px; box-shadow:0 20px 50px rgba(0,0,0,0.2); display:grid; grid-template-columns:1fr 360px; gap:16px; max-height:88vh; overflow:auto; }
    .summary-list{ max-height:56vh; overflow:auto; padding-right:8px; }
    .order-row{ display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid #f7f3fb; align-items:center; }
    .muted{ color:#666; font-size:13px; }
    .offer-line{ background:linear-gradient(90deg,#fff6fb,#fff); border-radius:8px; padding:8px; border:1px dashed rgba(214,51,132,0.08); font-weight:700; color:var(--accent); }
    .apply-input{ display:flex; gap:8px; margin-top:8px; }
    .apply-input input{ border-radius:8px; padding:8px; border:1px solid #eee; flex:1; }
    .small-action{ padding:8px 10px; font-size:13px; border-radius:8px; }

    /* responsive */
    @media (max-width:880px){
      .checkout-box{ grid-template-columns: 1fr; max-width:650px; }
      .cart-item{ flex-direction:row; }
      .cart-item-right{ text-align:left; min-width:unset; }
      .cart-total{ text-align:center; }
      .checkout-actions { display:flex; gap:8px; flex-direction:column; }
    }
  </style>
</head>
<body>

  <div class="cart-container">
    <h2 class="cart-title">🛍️ Your Flower Cart</h2>

    <div id="cartItems"></div>

    <div class="d-flex justify-content-center gap-2 mt-4">
      <a href="shop.html" class="btn small-btn back-btn"><i class="bi bi-arrow-left"></i> Continue Shopping</a>
      <button id="openCheckout" class="btn small-btn checkout-btn">Review Cart & Pay</button>
    </div>
  </div>

  <!-- Checkout overlay -->
  <div id="checkoutOverlay" class="overlay">
    <div class="checkout-box">
      <div>
        <h5 style="margin:0 0 8px 0; color:var(--primary)">Your Cart — Review</h5>
        <div class="summary-list" id="summaryList"></div>

        <h6 style="margin-top:12px;">Delivery Details</h6>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;">
          <input id="d_name" class="form-control" placeholder="Full name" style="flex:1; min-width:160px;">
          <input id="d_phone" class="form-control" placeholder="Mobile" style="width:140px;">
          <input id="d_colony" class="form-control" placeholder="Colony / Locality" style="flex:1;">
          <input id="d_city" class="form-control" placeholder="City" style="width:160px;">
          <input id="d_state" class="form-control" placeholder="State" style="width:160px;">
          <input id="d_pin" class="form-control" placeholder="Pincode" style="width:120px;">
        </div>

        <textarea id="d_note" class="form-control mt-2" placeholder="Add a note for florist" rows="2"></textarea>
      </div>

      <div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div style="font-weight:800">Order Summary</div>
          <div class="muted" id="chipOffer">Offer: <span id="appliedOffer">—</span></div>
        </div>

        <div style="margin-top:12px;">
          <div class="order-row"><div class="muted">Subtotal</div><div>$ <span id="co_subtotal">0</span></div></div>
          <div class="order-row"><div class="muted">Discount</div><div>- $ <span id="co_discount">0</span></div></div>
          <div class="order-row"><div class="muted">Delivery Charge</div><div>$ <span id="co_delivery">0</span></div></div>

          <div style="border-top:1px dashed #eee; padding-top:10px; margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
            <div style="font-weight:900">Grand Total</div>
            <div style="font-weight:900">$ <span id="co_total">0</span></div>
          </div>

          <div class="mt-3 offer-line">
            Coupon quick: <strong>ANK50</strong> ($50 off over $499) • <strong>FLOWER10</strong> (10% off) • <strong>ANK20</strong> (FREE flowers)
          </div>

          <div class="apply-input" style="margin-top:10px;">
            <input id="co_coupon" placeholder="Enter coupon code (e.g. ANK20)" />
            <button class="btn small-action btn-outline-primary" onclick="applyCoCoupon()">Apply</button>
          </div>
          <div id="co_coupon_msg" class="muted mt-2"></div>

          <div class="mt-3 checkout-actions">
            <button class="btn small-btn checkout-btn" id="co_proceed_payment" onclick="finalizeAndGoPayment()">Proceed to Payment</button>
            <button class="btn small-btn back-btn" onclick="closeCheckout()">Back to Cart</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>

  const cartContainer = document.getElementById('cartItems');
  const checkoutOverlay = document.getElementById('checkoutOverlay');
  const summaryList = document.getElementById('summaryList');

  let cart = JSON.parse(localStorage.getItem('flowerCart')) || [];

  function renderCart(){
    cartContainer.innerHTML = '';
    if(cart.length === 0){
      cartContainer.innerHTML = `<div class="empty-cart">
        <i class="bi bi-cart-x"></i>
        <h5 class="mt-3">Your cart is empty</h5>
      </div>`;
      return;
    }

    cart.forEach((item, idx) => {
      const itemTotal = item.price * item.qty;

      const wrapper = document.createElement('div');
      wrapper.className = 'cart-item';
      wrapper.innerHTML = `
        <img src="${item.img || 'https://via.placeholder.com/120'}" />
        <div class="cart-item-info">
          <div class="cart-item-title">${escapeHtml(item.title)}</div>
          <div class="cart-item-details">Color: ${escapeHtml(item.color || '—')}</div>
          <div class="cart-item-price">$ ${item.price.toFixed(2)} each</div>
          <div class="qty-row">
            <div class="qty-btn" onclick="changeQty(${idx}, -1)">−</div>
            <input class="qty-input" id="qty${idx}" type="number" min="1" value="${item.qty}" onchange="updateQtyFromInput(${idx})">
            <div class="qty-btn" onclick="changeQty(${idx}, 1)">+</div>
            <div style="flex:1"></div>
            <span class="remove-btn" onclick="removeItem(${idx})"><i class="bi bi-trash"></i></span>
          </div>
        </div>
        <div class="cart-item-right">
          <div class="fw-bold">$ ${itemTotal.toFixed(2)}</div>
        </div>
      `;

      cartContainer.appendChild(wrapper);
    });

    const totalDiv = document.createElement('div');
    totalDiv.className = 'cart-total';
    totalDiv.innerHTML = `Total Amount: <span class="text-success">$ ${calcSubtotal().toFixed(2)}</span>`;
    cartContainer.appendChild(totalDiv);
  }

  function calcSubtotal(){
    return cart.reduce((s,it)=> s + (it.price * it.qty), 0);
  }

  function changeQty(i, delta){
    const newQty = (cart[i].qty || 1) + delta;
    if(newQty < 1) return;
    cart[i].qty = newQty;
    localStorage.setItem('flowerCart', JSON.stringify(cart));
    renderCart();
  }

  function updateQtyFromInput(i){
    const el = document.getElementById('qty'+i);
    const val = parseInt(el.value) || 1;
    cart[i].qty = Math.max(1, val);
    localStorage.setItem('flowerCart', JSON.stringify(cart));
    renderCart();
  }

  function removeItem(i){
    cart.splice(i,1);
    localStorage.setItem('flowerCart', JSON.stringify(cart));
    renderCart();
  }

  document.getElementById('openCheckout').addEventListener('click', () => {
    if(cart.length === 0){
      alert('Your cart is empty.');
      return;
    }
    openCheckout();
  });

  function openCheckout(){
    checkoutOverlay.style.display = 'flex';
    renderSummary();
    const logged = JSON.parse(localStorage.getItem('loggedInUser') || 'null');
    if(logged){
      document.getElementById('d_name').value = logged.name || '';
      document.getElementById('d_phone').value = logged.mobile || '';
    }
    const delivery = Math.floor(40 + Math.random()*41); 
    checkoutState.deliveryCharge = delivery;
    updateTotalsUI();
  }

  function closeCheckout(){
    checkoutOverlay.style.display = 'none';
  }

  const checkoutState = {
    coupon: null,
    deliveryCharge: 0,
    discount: 0
  };

  function renderSummary(){
    summaryList.innerHTML = '';
    cart.forEach((it, i) => {
      const row = document.createElement('div');
      row.className = 'order-row';
      row.innerHTML = `
        <div style="display:flex; gap:10px; align-items:center;">
          <img src="${it.img || 'https://via.placeholder.com/60'}" style="width:60px;height:60px;border-radius:8px;object-fit:cover" />
          <div>
            <div style="font-weight:700">${escapeHtml(it.title)}</div>
            <div class="muted" style="font-size:13px">$ ${it.price.toFixed(2)} × ${it.qty} = $ ${(it.price*it.qty).toFixed(2)}</div>
          </div>
        </div>
        <div style="text-align:right;">
          <div style="font-weight:800">$ ${(it.price*it.qty).toFixed(2)}</div>
          <div style="margin-top:6px;">
            <button class="small-btn btn btn-outline-secondary" onclick="decreaseItem(${i})">−</button>
            <button class="small-btn btn btn-outline-secondary" onclick="increaseItem(${i})">+</button>
            <button class="small-btn btn btn-outline-danger" style="margin-left:6px" onclick="removeItem(${i})">Remove</button>
          </div>
        </div>
      `;
      summaryList.appendChild(row);
    });
    updateTotalsUI();
  }

  function decreaseItem(i){ changeQty(i, -1); renderSummary(); }
  function increaseItem(i){ changeQty(i, 1); renderSummary(); }

  function applyCoCoupon(){
    const code = (document.getElementById('co_coupon').value || '').trim().toUpperCase();
    if(!code){ document.getElementById('co_coupon_msg').textContent = 'Enter a coupon code.'; return; }
    const subtotal = calcSubtotal();
    if(code === 'ANK50'){
      if(subtotal >= 499){
        checkoutState.coupon = 'ANK50';
        checkoutState.discount = 50;
        document.getElementById('co_coupon_msg').textContent = 'ANK50 applied — $50 off';
      } else {
        document.getElementById('co_coupon_msg').textContent = 'Spend $499+ to use ANK50.';
        return;
      }
    } else if(code === 'FLOWER10'){
      checkoutState.coupon = 'FLOWER10';
      checkoutState.discount = Math.round(subtotal * 0.10);
      document.getElementById('co_coupon_msg').textContent = 'FLOWER10 applied — 10% off';
    } else if(code === 'ANK20'){
      checkoutState.coupon = 'ANK20';
      checkoutState.discount = subtotal;
      document.getElementById('co_coupon_msg').textContent = 'ANK20 applied — all flowers free 🎉';
    } else {
      checkoutState.coupon = null;
      checkoutState.discount = 0;
      document.getElementById('co_coupon_msg').textContent = 'Invalid coupon.';
      return;
    }
    updateTotalsUI();
  }

  function updateTotalsUI(){
    const subtotal = calcSubtotal();
    const discount = (checkoutState.discount || 0);
    const delivery = checkoutState.deliveryCharge || 0;
    const total = Math.max(0, subtotal - discount + delivery);

    document.getElementById('co_subtotal').textContent = subtotal.toFixed(2);
    document.getElementById('co_discount').textContent = discount.toFixed(2);
    document.getElementById('co_delivery').textContent = delivery.toFixed(2);
    document.getElementById('co_total').textContent = total.toFixed(2);
    document.getElementById('appliedOffer').textContent = checkoutState.coupon || '—';
  }

  function finalizeAndGoPayment(){
    const name = document.getElementById('d_name').value.trim();
    const phone = document.getElementById('d_phone').value.trim();
    const colony = document.getElementById('d_colony').value.trim();
    const city = document.getElementById('d_city').value.trim();
    const state = document.getElementById('d_state').value.trim();
    const pin = document.getElementById('d_pin').value.trim();

    if(!name || !phone || !colony || !city || !state || !pin){
      alert('Please fill full delivery details before proceeding to payment.');
      return;
    }

    const subtotal = calcSubtotal();
    const discount = checkoutState.discount || 0;
    const delivery = checkoutState.deliveryCharge || 0;
    const total = Math.max(0, subtotal - discount + delivery);

    const order = {
      id: 'FLW-' + Math.floor(1000 + Math.random()*9000),
      items: cart,
      subtotal: subtotal,
      discount: discount,
      deliveryCharge: delivery,
      total: total,
      coupon: checkoutState.coupon || null,
      deliveryDetails: { name, phone, colony, city, state, pin, note: document.getElementById('d_note').value || '' },
      createdAt: new Date().toISOString()
    };

    localStorage.setItem('ank_order', JSON.stringify(order));
    window.location.href = 'payment.html';
  }

  function escapeHtml(s){ return String(s||'').replace(/[&<>"]/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

  renderCart();

</script>

</body>
</html>
