<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact.ank</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #ffe5ec, #ffc4d6);
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
        overflow-x: hidden;
    }

    /* Floating petals */
    .petal {
        position: fixed;
        top: -10px;
        width: 25px;
        height: 25px;
        background-image: url('https://i.imgur.com/3y3K1uA.png');
        background-size: contain;
        background-repeat: no-repeat;
        animation: fall 8s linear infinite;
        opacity: 0.6;
        pointer-events: none;
    }

    @keyframes fall {
        0% { transform: translateY(-10vh) rotate(0deg); }
        100% { transform: translateY(110vh) rotate(360deg); }
    }

    /* Card */
    .contact-card {
        background: rgba(255,255,255,0.4);
        backdrop-filter: blur(12px);
        border-radius: 18px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        animation: fadeIn 1s ease forwards;
        width: 100%;
        max-width: 420px;
    }

    @keyframes fadeIn {
        from { transform: translateY(50px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    h2 {
        text-align: center;
        color: #d63384;
        font-size: 26px;
        font-weight: 600;
    }

    /* Popup */
    .popup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        background: white;
        width: 90%;
        max-width: 350px;
        padding: 30px 20px;
        text-align: center;
        border-radius: 20px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        opacity: 0;
        transition: all 0.4s ease;
        z-index: 999;
    }

    .popup.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }

    /* Make BG & Card perfect on small phones */
    @media (max-width: 480px) {
        body {
            background-size: cover;
            background-position: center;
            background-attachment: scroll;
            padding: 20px 0;
        }
    }
</style>
</head>
<body>

<!-- CENTERED CONTENT -->
<div class="d-flex justify-content-center align-items-center min-vh-100 px-3">

    <div class="contact-card p-4 p-sm-5">
        <h2 class="mb-4">🌸Say hello, we’re just a message away!</h2>

        <form id="contactForm">
            <input class="form-control mb-3" type="text" id="name" placeholder="Your Name" required>
            <input class="form-control mb-3" type="email" id="email" placeholder="Your Email" required>
            <input class="form-control mb-3" type="text" id="subject" placeholder="Subject" required>
            <textarea class="form-control mb-3" id="message" rows="4" placeholder="Write your message..." required></textarea>

            <button class="btn w-100 text-white" 
                    style="background:#d63384; border-radius:12px; font-weight:600; font-size:17px;"
                    type="submit">
                Send Message
            </button>
        </form>
    </div>

</div>

<!-- Popup -->
<div class="popup" id="popupMsg">
    <h3 style="color:#d63384;">Message Sent 💐</h3>
    <p>Thank you for contacting us!<br>We’ll get back to you shortly.</p>
    <p style="margin-top:10px;font-size:14px;color:#777;">Redirecting to Home...</p>
</div>

<script>
    // Petals
    for (let i = 0; i < 15; i++) {
        let petal = document.createElement("div");
        petal.className = "petal";
        petal.style.left = Math.random() * 100 + "vw";
        petal.style.animationDelay = Math.random() * 6 + "s";
        petal.style.transform = "scale(" + (0.6 + Math.random() * 0.8) + ")";
        document.body.appendChild(petal);
    }

    // Form Logic
    document.getElementById("contactForm").addEventListener("submit", function(e) {
        e.preventDefault();

        document.getElementById("popupMsg").classList.add("show");

        setTimeout(() => {
            window.location.href = "index.html";
        }, 5000);
    });
</script>

</body>
</html>
