<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact • Blossom Shop</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #ffe5ec, #ffc4d6);
        overflow-x: hidden;
        overflow-y: hidden;
    }

    /* Floating petals animation */
    .petal {
        position: fixed;
        top: -10px;
        width: 25px;
        height: 25px;
        background-image: url('https://i.imgur.com/3y3K1uA.png');
        background-size: contain;
        background-repeat: no-repeat;
        animation: fall 8s linear infinite;
        opacity: 0.6;
    }

    @keyframes fall {
        0% { transform: translateY(-10vh) rotate(0deg); }
        100% { transform: translateY(110vh) rotate(360deg); }
    }

    /* Contact Card */
    .contact-card {
        width: 90%;
        max-width: 420px;
        padding: 30px 25px;
        margin: 70px auto;
        background: rgba(255,255,255,0.4);
        backdrop-filter: blur(12px);
        border-radius: 18px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
        from { transform: translateY(50px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #d63384;
        font-size: 26px;
        font-weight: 600;
    }

    .contact-card input,
    .contact-card textarea {
        width: 100%;
        padding: 12px 14px;
        margin: 10px 0;
        border: none;
        outline: none;
        border-radius: 12px;
        background: rgba(255,255,255,0.8);
        font-size: 15px;
        box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }

    textarea {
        height: 110px;
        resize: none;
    }

    .btn {
        width: 100%;
        padding: 14px;
        background: #d63384;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 17px;
        font-weight: 600;
        margin-top: 10px;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(214, 51, 132, 0.4);
        transition: 0.2s;
    }
    .btn:hover {
        background: #b0266b;
    }

    /* Success Popup */
    .popup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        background: white;
        width: 80%;
        max-width: 350px;
        padding: 30px 20px;
        text-align: center;
        border-radius: 20px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        opacity: 0;
        transition: all 0.4s ease;
        z-index: 999;
    }

    .popup.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }

    .popup h3 {
        margin: 10px 0 5px;
        color: #d63384;
        font-size: 22px;
    }

    .popup p {
        font-size: 15px;
        color: #444;
    }
</style>
</head>
<body>

<!-- Floating petals JS generated below -->

<div class="contact-card">
    <h2>🌸 Contact Us</h2>

    <form id="contactForm">
        <input type="text" id="name" placeholder="Your Name" required>
        <input type="email" id="email" placeholder="Your Email" required>
        <input type="text" id="subject" placeholder="Subject" required>
        <textarea id="message" placeholder="Write your message..." required></textarea>
        <button class="btn" type="submit">Send Message</button>
    </form>
</div>

<!-- Popup -->
<div class="popup" id="popupMsg">
    <h3>Message Sent 💐</h3>
    <p>Thank you for contacting us!<br>We’ll get back to you shortly.</p>
    <p style="margin-top:10px;font-size:14px;color:#777;">Redirecting to Home...</p>
</div>

<script>
    // Generate random petals
    for (let i = 0; i < 15; i++) {
        let petal = document.createElement("div");
        petal.className = "petal";
        petal.style.left = Math.random() * 100 + "vw";
        petal.style.animationDelay = Math.random() * 6 + "s";
        petal.style.transform = "scale(" + (0.6 + Math.random() * 0.8) + ")";
        document.body.appendChild(petal);
    }

    // Popup + redirect logic
    document.getElementById("contactForm").addEventListener("submit", function(e) {
        e.preventDefault();

        document.getElementById("popupMsg").classList.add("show");

        setTimeout(() => {
            window.location.href = "index.html"; // redirect
        }, 5000);
    });
</script>

</body>
</html>
